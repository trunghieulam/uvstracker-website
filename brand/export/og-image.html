<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>feature graphic export</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Source+Sans+3:wght@400&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{display:grid;grid-template-columns:1fr auto;align-items:center;padding:0 72px;box-sizing:border-box;
  background:radial-gradient(circle at 78% 22%,#FFF2D6 0 6%,transparent 7%),linear-gradient(160deg,#4A90C4,#EBCFA4);color:#10202E;font-family:"Source Sans 3",system-ui,sans-serif}
h1{font:700 72px/1.05 Outfit,system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 18px;text-wrap:balance}
p{font-size:26px;margin:0;opacity:.85}
.mark{width:360px;height:360px}
</style></head><body>
<div><h1>How safe are you in today's sun?</h1><p>UV Tracker &middot; Free forever</p></div>
<svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs><linearGradient id="uv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2B23C"/><stop offset="1" stop-color="#E0562F"/></linearGradient></defs>
  <circle cx="50" cy="50" r="17" fill="url(#uv)"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#uv)" stroke-width="10" stroke-linecap="round" stroke-dasharray="165 55" transform="rotate(-90 50 50)"/>
</svg>
</body></html>

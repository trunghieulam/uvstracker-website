<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>app-icon export</title>
<style>html,body{margin:0;width:512px;height:512px;overflow:hidden;background:#FBF3EC}svg{display:block;width:512px;height:512px}</style>
</head><body>
<!-- viewBox padded to 150 units so the 100-unit mark fills 66 % — adaptive-icon safe zone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -25 150 150">
  <defs><linearGradient id="uv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2B23C"/><stop offset="1" stop-color="#E0562F"/></linearGradient></defs>
  <circle cx="50" cy="50" r="17" fill="url(#uv)"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#uv)" stroke-width="10" stroke-linecap="round" stroke-dasharray="165 55" transform="rotate(-90 50 50)"/>
</svg>
</body></html>

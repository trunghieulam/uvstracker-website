<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="UV Tracker">
  <defs>
    <linearGradient id="uv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2B23C"/><stop offset="1" stop-color="#E0562F"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="17" fill="url(#uv)"/>
  <!-- 165/220 of the circumference: the Protection ring at 75 %, gap top-right. -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#uv)" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="165 55" transform="rotate(-90 50 50)"/>
</svg>
